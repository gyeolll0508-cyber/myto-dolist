<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro - 스마트 할 일 관리</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter, Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom drag animation & touch utilities */
        .dragging {
            opacity: 0.5;
            transform: scale(0.98);
            border: 2px dashed #0284c7;
        }
        .task-item {
            transition: all 0.2s ease-in-out;
        }
        .task-item:hover .action-buttons {
            opacity: 1;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 md:p-10">

    <!-- App Container -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden flex flex-col my-auto">
        
        <!-- Header & Stats Bar -->
        <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white p-6 sm:p-8">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-indigo-400">
                        <i class="fa-solid font-bold fa-check-double text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">TaskMaster Pro</h1>
                        <p class="text-xs text-slate-400">오늘의 할 일을 체계적으로 관리하세요</p>
                    </div>
                </div>
                <span id="currentDate" class="text-xs font-medium bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50 text-slate-300"></span>
            </div>

            <!-- Dashboard Stats Widget -->
            <div class="grid grid-cols-3 gap-3 mt-6 pt-4 border-t border-slate-800">
                <div class="bg-slate-800/50 rounded-xl p-3 text-center border border-slate-700/30">
                    <span class="block text-xs text-slate-400 mb-1">전체</span>
                    <span id="statTotal" class="text-xl font-bold text-slate-100">0</span>
                </div>
                <div class="bg-slate-800/50 rounded-xl p-3 text-center border border-slate-700/30">
                    <span class="block text-xs text-amber-400/80 mb-1">진행 중</span>
                    <span id="statPending" class="text-xl font-bold text-amber-400">0</span>
                </div>
                <div class="bg-slate-800/50 rounded-xl p-3 text-center border border-slate-700/30">
                    <span class="block text-xs text-emerald-400/80 mb-1">완료됨</span>
                    <span id="statCompleted" class="text-xl font-bold text-emerald-400">0</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mt-4">
                <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
                    <span>달성률</span>
                    <span id="progressPercent" class="font-semibold text-indigo-300">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-2 rounded-full transition-all duration-500 w-0"></div>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="p-6 sm:p-8 flex-1 flex flex-col space-y-6">
            
            <!-- Input Form Section -->
            <div class="space-y-2">
                <form id="todoForm" onsubmit="event.preventDefault(); addTodo();" class="relative flex items-center">
                    <input 
                        type="text" 
                        id="todoInput" 
                        placeholder="새로운 할 일을 입력하세요... (최대 100자)" 
                        maxlength="100" 
                        spellcheck="true" 
                        autocorrect="on"
                        class="w-full py-3.5 pl-4 pr-24 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-slate-800 placeholder-slate-400 text-sm transition-all"
                        oninput="validateInputLive()"
                    />
                    <div class="absolute right-2 flex items-center space-x-2">
                        <span id="charCounter" class="text-xs text-slate-400 px-1">0/100</span>
                        <button 
                            type="submit" 
                            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center space-x-1"
                        >
                            <i class="fa-solid fa-plus"></i>
                            <span class="hidden sm:inline">추가</span>
                        </button>
                    </div>
                </form>
                
                <!-- Input Validation Alert Bar -->
                <div id="inputNotice" class="hidden text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded-lg p-2.5 flex items-center space-x-2 animate-fadeIn">
                    <i class="fa-solid fa-circle-exclamation text-amber-500"></i>
                    <span id="inputNoticeText">알림 메시지</span>
                </div>
            </div>

            <!-- Filter Controls & Batch Actions -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2">
                <!-- Filter Tabs -->
                <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-medium text-slate-600 self-start sm:self-auto">
                    <button id="filterAll" onclick="setFilter('all')" class="px-3 py-1.5 rounded-lg transition-all bg-white text-slate-900 shadow-sm">전체</button>
                    <button id="filterPending" onclick="setFilter('pending')" class="px-3 py-1.5 rounded-lg transition-all hover:text-slate-900">진행 중</button>
                    <button id="filterCompleted" onclick="setFilter('completed')" class="px-3 py-1.5 rounded-lg transition-all hover:text-slate-900">완료됨</button>
                </div>

                <!-- Clear Buttons -->
                <div class="flex items-center space-x-2 text-xs">
                    <button onclick="clearCompleted()" class="text-slate-500 hover:text-amber-600 transition-colors px-2 py-1 flex items-center space-x-1">
                        <i class="fa-regular fa-circle-check"></i>
                        <span>완료 항목 정리</span>
                    </button>
                    <span class="text-slate-300">|</span>
                    <button onclick="clearAll()" class="text-slate-500 hover:text-red-600 transition-colors px-2 py-1 flex items-center space-x-1">
                        <i class="fa-regular fa-trash-can"></i>
                        <span>전체 삭제</span>
                    </button>
                </div>
            </div>

            <!-- Todo List Drag & Drop Area -->
            <ul id="todoList" class="space-y-2 min-h-[200px]">
                <!-- Dynamic Items will be rendered here -->
            </ul>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center">
                <div class="w-16 h-16 bg-slate-100 text-slate-300 rounded-full flex items-center justify-center text-2xl mb-3">
                    <i class="fa-regular fa-clipboard"></i>
                </div>
                <p class="text-slate-500 font-medium text-sm">등록된 할 일이 없습니다</p>
                <p class="text-slate-400 text-xs mt-1">위 입력창에서 새로운 목표를 작성해보세요!</p>
            </div>
        </main>

        <!-- Footer Notice -->
        <footer class="bg-slate-50 border-t border-slate-100 px-6 py-3 text-center text-xs text-slate-400 flex items-center justify-between">
            <span><i class="fa-solid fa-grip-lines text-slate-300 mr-1"></i> 순서 변경은 항목을 드래그하세요</span>
            <span>TaskMaster v1.0</span>
        </footer>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // State Management
        let todos = JSON.parse(localStorage.getItem('taskmaster_todos')) || [];
        let currentFilter = 'all'; // 'all', 'pending', 'completed'

        // DOM Elements
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');
        const charCounter = document.getElementById('charCounter');
        const inputNotice = document.getElementById('inputNotice');
        const inputNoticeText = document.getElementById('inputNoticeText');

        // Init App
        document.addEventListener('DOMContentLoaded', () => {
            renderDate();
            render();
            todoInput.focus();

            // Setup Drag and Drop Listeners for List
            setupListDragAndDrop();
        });

        // Display Current Date
        function renderDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' };
            document.getElementById('currentDate').innerText = now.toLocaleDateString('ko-KR', options);
        }

        // Live Input Validation & Character Counter
        function validateInputLive() {
            const text = todoInput.value;
            const length = text.length;
            charCounter.innerText = `${length}/100`;

            if (length >= 100) {
                charCounter.classList.add('text-red-500', 'font-bold');
            } else {
                charCounter.classList.remove('text-red-500', 'font-bold');
            }

            // Realtime continuous repetition / character alert check
            if (/(.)\1{4,}/.test(text)) {
                showNotice("동일한 문자가 너무 많이 연속되고 있습니다.");
            } else {
                hideNotice();
            }
        }

        function showNotice(msg) {
            inputNoticeText.innerText = msg;
            inputNotice.classList.remove('hidden');
        }

        function hideNotice() {
            inputNotice.classList.add('hidden');
        }

        // Add New Todo
        function addTodo() {
            const rawText = todoInput.value;
            const trimmedText = rawText.trim();

            // 1. Minimum Length & Empty Check
            if (!trimmedText) {
                showToast("할 일 내용을 입력해주세요.", "warning");
                todoInput.focus();
                return;
            }

            if (trimmedText.length < 2) {
                showToast("최소 2자 이상 입력해주세요.", "warning");
                return;
            }

            // 2. Duplicate Check (Non-case sensitive, spacing ignored)
            const isDuplicate = todos.some(t => t.text.replace(/\s+/g, '').toLowerCase() === trimmedText.replace(/\s+/g, '').toLowerCase());
            if (isDuplicate) {
                showToast("이미 동일한 할 일이 목록에 존재합니다!", "error");
                showNotice("중복된 항목입니다. 다른 내용을 입력하세요.");
                return;
            }

            // Create New Item Object
            const newTodo = {
                id: Date.now().toString(),
                text: trimmedText,
                completed: false,
                createdAt: new Date().toISOString()
            };

            // Prepend to array to keep creation order (or append)
            todos.unshift(newTodo);
            saveAndRender();

            // Reset Input
            todoInput.value = '';
            charCounter.innerText = '0/100';
            hideNotice();
            showToast("새로운 할 일이 추가되었습니다.", "success");
        }

        // Toggle Todo Completion
        function toggleTodo(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            saveAndRender();
        }

        // Delete Individual Todo
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveAndRender();
            showToast("항목이 삭제되었습니다.", "info");
        }

        // Enable Edit Mode
        function startEditing(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            const itemElem = document.querySelector(`[data-id="${id}"]`);
            const textElem = itemElem.querySelector('.todo-text');

            // Render Inline Input Form
            textElem.innerHTML = `
                <div class="flex items-center space-x-2 w-full my-1">
                    <input 
                        type="text" 
                        id="editInput-${id}" 
                        value="${escapeHtml(todo.text)}" 
                        maxlength="100"
                        spellcheck="true"
                        class="w-full bg-white px-3 py-1.5 text-sm border border-indigo-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        onkeydown="handleEditKeyDown(event, '${id}')"
                    />
                    <button onclick="saveEdit('${id}')" class="text-xs bg-indigo-600 text-white px-2.5 py-1.5 rounded-md hover:bg-indigo-700">저장</button>
                    <button onclick="render()" class="text-xs bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-md hover:bg-slate-300">취소</button>
                </div>
            `;

            const editInput = document.getElementById(`editInput-${id}`);
            editInput.focus();
            editInput.setSelectionRange(editInput.value.length, editInput.value.length);
        }

        function handleEditKeyDown(event, id) {
            if (event.key === 'Enter') {
                event.preventDefault();
                saveEdit(id);
            } else if (event.key === 'Escape') {
                render();
            }
        }

        // Save Edited Text
        function saveEdit(id) {
            const editInput = document.getElementById(`editInput-${id}`);
            if (!editInput) return;

            const newText = editInput.value.trim();

            if (!newText) {
                showToast("내용을 입력해 주세요.", "warning");
                return;
            }

            if (newText.length < 2) {
                showToast("최소 2자 이상 입력해주세요.", "warning");
                return;
            }

            // Check duplicate against other items
            const isDuplicate = todos.some(t => t.id !== id && t.text.replace(/\s+/g, '').toLowerCase() === newText.replace(/\s+/g, '').toLowerCase());
            if (isDuplicate) {
                showToast("이미 동일한 할 일이 목록에 존재합니다.", "error");
                return;
            }

            todos = todos.map(t => t.id === id ? { ...t, text: newText } : t);
            saveAndRender();
            showToast("수정 사항이 저장되었습니다.", "success");
        }

        // Filter Setting
        function setFilter(filter) {
            currentFilter = filter;
            
            // UI Button Style Updates
            ['All', 'Pending', 'Completed'].forEach(f => {
                const btn = document.getElementById(`filter${f}`);
                if (f.toLowerCase() === filter) {
                    btn.className = "px-3 py-1.5 rounded-lg transition-all bg-white text-slate-900 shadow-sm font-semibold";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-900 font-normal";
                }
            });

            render();
        }

        // Clear Completed Tasks
        function clearCompleted() {
            const completedCount = todos.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast("완료된 항목이 없습니다.", "info");
                return;
            }

            todos = todos.filter(t => !t.completed);
            saveAndRender();
            showToast(`완료된 ${completedCount}개 항목을 정리했습니다.`, "info");
        }

        // Clear All Tasks
        function clearAll() {
            if (todos.length === 0) return;
            
            if (confirm("정말로 모든 할 일을 삭제하시겠습니까?")) {
                todos = [];
                saveAndRender();
                showToast("모든 할 일이 삭제되었습니다.", "info");
            }
        }

        // Storage & Render Pipeline
        function saveAndRender() {
            localStorage.setItem('taskmaster_todos', JSON.stringify(todos));
            render();
        }

        function render() {
            // Filter Items
            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'pending') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
                return true;
            });

            // Update Stats
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const pending = total - completed;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statCompleted').innerText = completed;
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;

            // Toggle Empty State UI
            if (filteredTodos.length === 0) {
                todoList.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                // Render List
                todoList.innerHTML = filteredTodos.map((todo) => `
                    <li 
                        data-id="${todo.id}" 
                        draggable="true" 
                        class="task-item bg-white border ${todo.completed ? 'border-slate-200 bg-slate-50/60' : 'border-slate-200'} rounded-xl p-3.5 flex items-center justify-between gap-3 shadow-sm hover:shadow-md group cursor-grab active:cursor-grabbing"
                    >
                        <div class="flex items-center space-x-3 flex-1 min-w-0">
                            <!-- Drag Handle Icon -->
                            <div class="text-slate-300 group-hover:text-slate-400 cursor-grab px-1">
                                <i class="fa-solid fa-grip-vertical text-sm"></i>
                            </div>

                            <!-- Custom Checkbox -->
                            <button 
                                onclick="toggleTodo('${todo.id}')" 
                                class="w-5 h-5 rounded-md border ${todo.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-indigo-500'} flex items-center justify-center transition-colors flex-shrink-0"
                            >
                                ${todo.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </button>

                            <!-- Task Text -->
                            <div class="todo-text flex-1 min-w-0" ondblclick="startEditing('${todo.id}')">
                                <span class="text-sm font-medium ${todo.completed ? 'line-through text-slate-400' : 'text-slate-700'} block truncate select-none">
                                    ${escapeHtml(todo.text)}
                                </span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="action-buttons flex items-center space-x-1 opacity-90 sm:opacity-0 transition-opacity">
                            <button 
                                onclick="startEditing('${todo.id}')" 
                                title="수정" 
                                class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-indigo-50 transition-colors"
                            >
                                <i class="fa-regular fa-pen-to-square text-xs"></i>
                            </button>
                            <button 
                                onclick="deleteTodo('${todo.id}')" 
                                title="삭제" 
                                class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition-colors"
                            >
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </li>
                `).join('');
            }
        }

        // HTML Sanitizer
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Drag & Drop Functionality for Reordering Tasks
        function setupListDragAndDrop() {
            let draggedItem = null;

            todoList.addEventListener('dragstart', (e) => {
                const target = e.target.closest('li');
                if (!target) return;
                draggedItem = target;
                target.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });

            todoList.addEventListener('dragend', (e) => {
                const target = e.target.closest('li');
                if (!target) return;
                target.classList.remove('dragging');
                
                // Save new ordering based on DOM positions
                updateTodoOrderFromDOM();
            });

            todoList.addEventListener('dragover', (e) => {
                e.preventDefault();
                const afterElement = getDragAfterElement(todoList, e.clientY);
                if (draggedItem) {
                    if (afterElement == null) {
                        todoList.appendChild(draggedItem);
                    } else {
                        todoList.insertBefore(draggedItem, afterElement);
                    }
                }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.task-item:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function updateTodoOrderFromDOM() {
            const domItems = [...todoList.querySelectorAll('li')];
            const newOrderedIds = domItems.map(item => item.getAttribute('data-id'));
            
            // Re-sort current filter view order into full todo array
            const reorderedTodos = [];
            
            // Append items in new order
            newOrderedIds.forEach(id => {
                const item = todos.find(t => t.id === id);
                if (item) reorderedTodos.push(item);
            });

            // Append items that were hidden due to active filter
            todos.forEach(t => {
                if (!newOrderedIds.includes(t.id)) {
                    reorderedTodos.push(t);
                }
            });

            todos = reorderedTodos;
            localStorage.setItem('taskmaster_todos', JSON.stringify(todos));
        }

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const bgColors = {
                success: 'bg-emerald-800 text-emerald-50 border-emerald-700',
                error: 'bg-red-800 text-red-50 border-red-700',
                warning: 'bg-amber-800 text-amber-50 border-amber-700',
                info: 'bg-slate-800 text-slate-50 border-slate-700'
            };

            const icons = {
                success: '<i class="fa-solid fa-circle-check text-emerald-400"></i>',
                error: '<i class="fa-solid fa-circle-xmark text-red-400"></i>',
                warning: '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>',
                info: '<i class="fa-solid fa-circle-info text-blue-400"></i>'
            };

            toast.className = `flex items-center space-x-2 px-4 py-3 rounded-xl border shadow-xl text-xs font-medium transform transition-all duration-300 opacity-0 translate-y-2 pointer-events-auto ${bgColors[type] || bgColors.info}`;
            toast.innerHTML = `${icons[type] || icons.info} <span>${escapeHtml(message)}</span>`;

            container.appendChild(toast);

            // Animate In
            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            // Remove Toast after timeout
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
